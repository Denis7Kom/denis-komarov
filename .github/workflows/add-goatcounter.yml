name: Add GoatCounter counters
on:
  push:
    branches: [feature/goatcounter-pageviews]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/goatcounter-pageviews
      - name: Patch existing index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          
          path = Path("index.html")
          data = path.read_bytes()
          if b'id="goatcounter-pageviews"' in data:
              raise SystemExit("Integration is already installed; no changes needed")
          newline = b"\r\n" if b"\r\n" in data else b"\n"
          
          css = """
              /* GoatCounter footer counter */
              .gc-stats { display:flex; justify-content:center; padding-bottom:28px; }
              .gc-stats-card {
                display:flex; align-items:center; flex-wrap:wrap; gap:14px;
                padding:12px 20px; min-height:62px;
                border:1px solid rgba(255,184,77,.2); border-radius:20px;
                background:linear-gradient(120deg,rgba(255,179,71,.10),rgba(255,255,255,.035));
                box-shadow:0 12px 38px rgba(0,0,0,.17);
              }
              .gc-stats-icon { display:grid; place-items:center; width:34px; height:34px;
                border-radius:12px; color:var(--accent-3); background:rgba(255,179,71,.13); }
              .gc-stats-icon svg {width:20px;height:20px}
              .gc-stats-label {color:var(--muted);font-size:.85rem;font-weight:700}
              .gc-stats-value {color:var(--accent-3);font:800 1.35rem var(--mono);
                letter-spacing:-.035em;font-variant-numeric:tabular-nums}
              .gc-stats-note {color:var(--muted-2);font-size:.76rem}
              @media(max-width:520px) {
                .gc-stats-card{gap:9px;padding:10px 13px;border-radius:16px}
                .gc-stats-note{flex-basis:100%;padding-left:43px}
              }
          """
          
          html = """
              <div class="container gc-stats" id="goatcounter-pageviews">
                <div class="gc-stats-card" aria-label="Website page views">
                  <span class="gc-stats-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                      <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                  </span>
                  <span class="gc-stats-label" id="gc-label">Page views</span>
                  <span class="gc-stats-value" id="gc-value" aria-live="polite" title="Waiting for stats">—</span>
                  <span class="gc-stats-note" id="gc-note">Since tracking started</span>
                </div>
              </div>
          """
          
          js = """
            <script>
              /* Public GoatCounter total pageviews. count_unique is not a unique count. */
              (() => {
                const number = document.getElementById('gc-value');
                const label = document.getElementById('gc-label');
                const note = document.getElementById('gc-note');
                const words = {
                  en: ['Page views', 'Since tracking started'],
                  ru: ['Просмотры', 'С начала учёта'],
                  it: ['Visualizzazioni', "Dall'inizio del conteggio"],
                  de: ['Seitenaufrufe', 'Seit Beginn der Erfassung']
                };
                let count = null;
                const render = () => {
                  const [l, n] = words[document.documentElement.lang] || words.en;
                  label.textContent = l;
                  note.textContent = n;
                  number.textContent = count === null ? '—' : count;
                };
                document.querySelectorAll('.lang-btn').forEach(btn =>
                  btn.addEventListener('click', () => requestAnimationFrame(render)));
                render();
                fetch('https://denis-komarov.goatcounter.com/counter/TOTAL.json')
                  .then(r => { if (!r.ok) throw new Error('Counter unavailable'); return r.json(); })
                  .then(d => {
                    if (d && (typeof d.count === 'string' || typeof d.count === 'number')) {
                      count = String(d.count);
                      number.title = 'Page views (cached for up to 4 hours)';
                      render();
                    }
                  })
                  .catch(() => { number.title = 'Enable public visitor counts in GoatCounter settings'; render(); });
              })();
            </script>
            <script data-goatcounter="https://denis-komarov.goatcounter.com/count"
                    async src="https://gc.zgo.at/count.js"></script>
          """
          
          def add_before(anchor, content):
              global data
              a = anchor.encode()
              assert data.count(a) == 1, f"Expected exactly one {anchor}"
              patch = newline.join(content.strip("\n").encode("utf-8").split(b"\n"))
              data = data.replace(a, patch + newline + a, 1)
          
          add_before("  </style>", css)
          add_before("  </footer>", html)
          add_before("</body>", js)
          assert data.count(b'id="goatcounter-pageviews"') == 1
          assert data.count(b'data-goatcounter="https://denis-komarov.goatcounter.com/count"') == 1
          path.write_bytes(data)
          print("Patched index.html; bytes:", len(data))
          
          PY
      - name: Remove temporary workflow and commit changes
        run: |
          rm -f .github/workflows/add-goatcounter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-goatcounter.yml
          git commit -m 'Add GoatCounter analytics and public pageviews'
          git push origin feature/goatcounter-pageviews
