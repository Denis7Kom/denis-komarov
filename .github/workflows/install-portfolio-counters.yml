name: Install portfolio visit counters
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/install-portfolio-counters.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Insert stats into existing standalone HTML
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          file = Path('index.html')
          html = file.read_bytes().decode('utf-8')
          if '<!-- portfolio-analytics-goatcounter -->' in html:
              print('Analytics already installed.')
          else:
              assert '</body>' in html, 'Cannot find closing body tag'
              payload = """  <!-- portfolio-analytics-goatcounter -->
          <script>
          (() => {
            const site='https://denis-komarov.goatcounter.com';
            const visits='/denis-komarov/';
            const views='/denis-komarov/__pageviews';
            const text={
              en:['Site activity','Page views','Visitors (approx.)','8-hour session estimate, not lifetime unique people.','GoatCounter · delayed'],
              ru:['Активность сайта','Просмотры','Посетители (≈)','Оценка по 8-часовым сеансам, а не число уникальных людей за всё время.','GoatCounter · с задержкой'],
              it:['Attività del sito','Visualizzazioni','Visitatori (≈)','Stima tramite sessioni di 8 ore, non persone uniche nel tempo.','GoatCounter · dati differiti'],
              de:['Website-Aktivität','Seitenaufrufe','Besucher (≈)','Schätzung anhand von 8-Stunden-Sitzungen, nicht dauerhaft eindeutigen Personen.','GoatCounter · verzögert']
            };
            const style=document.createElement('style');
            style.textContent=`
              .traffic-panel{width:min(100%,820px);margin:0 auto 28px;padding:19px 22px 16px;border:1px solid rgba(255,179,71,.2);border-radius:23px;background:linear-gradient(120deg,rgba(255,179,71,.08),rgba(255,106,0,.022) 65%,rgba(255,255,255,.026));box-shadow:0 14px 45px rgba(0,0,0,.12)}
              .traffic-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
              .traffic-heading{font-size:.76rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-3)}
              .traffic-provider{font-size:.72rem;color:var(--muted-2)}
              .traffic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
              .traffic-item{display:flex;align-items:center;gap:13px;min-width:0;padding:14px 17px;border:1px solid rgba(255,184,77,.12);border-radius:16px;background:rgba(6,4,3,.42)}
              .traffic-symbol{display:grid;place-items:center;flex:0 0 39px;width:39px;height:39px;color:var(--accent-3);background:rgba(255,179,71,.12);border-radius:13px;font-size:1.2rem}
              .traffic-label{font-size:.78rem;color:var(--muted)}
              .traffic-number{display:block;font-size:clamp(1.25rem,2vw,1.7rem);font-weight:850;line-height:1.2;color:var(--text);font-variant-numeric:tabular-nums}
              .traffic-number:empty::after{content:'—';color:var(--muted-2)}
              .traffic-footnote{margin-top:12px;color:var(--muted-2);font-size:.71rem;line-height:1.5}
              @media(max-width:560px){.traffic-panel{padding:15px}.traffic-item{gap:9px;padding:10px}.traffic-symbol{flex-basis:31px;width:31px;height:31px;font-size:1rem}.traffic-provider{text-align:right}.traffic-label{font-size:.7rem}}
              @media(max-width:380px){.traffic-grid{grid-template-columns:1fr}}
            `;
            document.head.appendChild(style);
            const footer=document.querySelector('.site-footer');
            if(!footer)return;
            const panel=document.createElement('section');
            panel.className='traffic-panel';
            panel.setAttribute('aria-label','Site traffic');
            panel.innerHTML=`
              <div class="traffic-top"><span class="traffic-heading" data-metric-translate="0"></span><span class="traffic-provider" data-metric-translate="4"></span></div>
              <div class="traffic-grid">
                <div class="traffic-item"><span class="traffic-symbol" aria-hidden="true">◉</span><div><span class="traffic-label" data-metric-translate="1"></span><strong id="site-pageviews" class="traffic-number" aria-live="polite"></strong></div></div>
                <div class="traffic-item"><span class="traffic-symbol" aria-hidden="true">◎</span><div><span class="traffic-label" data-metric-translate="2"></span><strong id="site-visitors" class="traffic-number" aria-live="polite"></strong></div></div>
              </div>
              <p class="traffic-footnote" data-metric-translate="3"></p>
            `;
            footer.insertBefore(panel,footer.firstChild);
            function translate(){
              const locale=text[document.documentElement.lang]||text.en;
              panel.querySelectorAll('[data-metric-translate]').forEach(el=>{el.textContent=locale[Number(el.dataset.metricTranslate)]});
            }
            translate();
            document.querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',translate));
            async function show(id,path){
              const el=document.getElementById(id);
              try {
                const response=await fetch(site+'/counter/'+encodeURIComponent(path)+'.json',{credentials:'omit',cache:'no-store'});
                if(response.status===404){el.textContent='0';return;}
                if(!response.ok)throw new Error('HTTP '+response.status);
                const data=await response.json();
                if(typeof data.count!=='string'&&typeof data.count!=='number')throw Error('Invalid counter JSON');
                el.textContent=String(data.count);
              }catch(_){
                el.textContent='—';
                el.title='Enable Allow adding visitor counts on your website in GoatCounter settings';
              }
            }
            // One session-deduplicated visit plus one unconditional reload count.
            const tracker=document.createElement('script');
            tracker.async=true;
            tracker.src='https://gc.zgo.at/count.js';
            tracker.dataset.goatcounter=site+'/count';
            tracker.dataset.goatcounterSettings='{"no_onload":true}';
            tracker.addEventListener('load',()=>{
              if(typeof window.goatcounter?.count!=='function')return;
              window.goatcounter.count({path:visits,title:'Portfolio visits',no_session:false});
              window.goatcounter.count({path:views,title:'Portfolio page loads',no_session:true});
            });
            document.head.appendChild(tracker);
            show('site-pageviews',views);
            show('site-visitors',visits);
          })();
          </script>
          """
              newline = '\r\n' if '\r\n' in html else '\n'
              payload = payload.replace('\n', newline)
              html = html.replace('</body>', payload + '</body>', 1)
              assert html.count('<!-- portfolio-analytics-goatcounter -->') == 1
              assert html.count('id="site-visitors"') == 1
              file.write_bytes(html.encode('utf-8'))
          PY
      - name: Remove temporary workflow and commit HTML
        shell: bash
        run: |
          rm -f .github/workflows/install-portfolio-counters.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/install-portfolio-counters.yml
          if ! git diff --cached --quiet; then
            git commit -m "Add public pageview and session visit metrics"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
