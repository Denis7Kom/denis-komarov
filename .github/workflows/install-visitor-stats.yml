name: Install visitor statistics
on:
  push:
    branches: [feat/visitor-stats]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visitor-stats
      - name: Add counters to existing HTML
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_bytes().decode("utf-8")
          if 'dk-public-stats-v1' in s:
              print("Patch already applied")
          else:
              assert s.count("</style>") == 1
              assert s.count('<footer class="site-footer">') == 1
              assert s.count("</body>") == 1
              css = "\n/* dk-public-stats-v1: small responsive counters in the footer */\n.site-analytics{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;padding:18px 22px;border:1px solid rgba(255,184,77,.17);border-radius:22px;background:linear-gradient(110deg,rgba(255,179,71,.065),rgba(255,255,255,.025))}\n.site-analytics-heading{color:var(--accent-3);font:700 .69rem/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase}\n.site-analytics-note{display:block;max-width:370px;margin-top:5px;color:var(--muted-2);font-size:.72rem;line-height:1.5}\n.site-analytics-values{display:flex;flex-wrap:wrap;align-items:center;gap:12px}\n.site-analytics-stat{min-width:148px;padding:8px 17px;border-left:1px solid rgba(255,184,77,.18)}\n.site-analytics-number{display:block;font-size:clamp(1.4rem,2.1vw,1.85rem);line-height:1.2;font-weight:850;letter-spacing:-.045em;color:var(--text);font-variant-numeric:tabular-nums}\n.site-analytics-caption{display:block;margin-top:4px;font-size:.77rem;color:var(--muted);font-weight:600}\n@media(max-width:720px){.site-analytics{flex-direction:column;align-items:flex-start;padding:16px}.site-analytics-values{width:100%;gap:0}.site-analytics-stat{flex:1;min-width:0;padding:8px 10px}.site-analytics-stat:first-child{border-left:0;padding-left:0}}\n"
              panel = "\n  <div class=\"container site-analytics\" aria-label=\"Site visit statistics\">\n    <div>\n      <span class=\"site-analytics-heading\" data-stats-label=\"heading\">Site activity</span>\n      <small class=\"site-analytics-note\" data-stats-label=\"note\">Since tracking began. Unique visitors are estimated by browser.</small>\n    </div>\n    <div class=\"site-analytics-values\">\n      <div class=\"site-analytics-stat\">\n        <strong class=\"site-analytics-number\" id=\"dk-pageviews\" aria-live=\"polite\">—</strong>\n        <span class=\"site-analytics-caption\" data-stats-label=\"views\">Page views</span>\n      </div>\n      <div class=\"site-analytics-stat\">\n        <strong class=\"site-analytics-number\" id=\"dk-unique\" aria-live=\"polite\">—</strong>\n        <span class=\"site-analytics-caption\" data-stats-label=\"unique\">Unique visitors*</span>\n      </div>\n    </div>\n  </div>\n"
              script = "\n  <!-- GoatCounter: page load totals + approximate unique browsers. -->\n  <script id=\"dk-goat-script\" data-goatcounter=\"https://denis-komarov.goatcounter.com/count\"\n          data-goatcounter-settings='{\"no_session\":true}'\n          async src=\"https://gc.zgo.at/count.js\"></script>\n  <script>\n  /* dk-public-stats-v1 */\n  (() => {\n    const base = 'https://denis-komarov.goatcounter.com';\n    const browserEvent = 'first-browser-v1';\n    const browserKey = 'dk-first-browser-v1';\n    const labels = {\n      en:{heading:'Site activity',note:'Since tracking began. Unique visitors are estimated by browser.',views:'Page views',unique:'Unique visitors*'},\n      ru:{heading:'Активность сайта',note:'С момента подключения. Уникальные посетители — оценка по браузерам.',views:'Просмотры',unique:'Уникальные посетители*'},\n      it:{heading:'Attività del sito',note:'Dall’attivazione. Visitatori unici stimati per browser.',views:'Visualizzazioni',unique:'Visitatori unici*'},\n      de:{heading:'Website-Aktivität',note:'Seit Messbeginn. Eindeutige Besucher werden nach Browser geschätzt.',views:'Seitenaufrufe',unique:'Eindeutige Besucher*'}\n    };\n    const localize = () => {\n      const dict = labels[document.documentElement.lang] || labels.en;\n      document.querySelectorAll('[data-stats-label]').forEach(el => {\n        el.textContent = dict[el.dataset.statsLabel];\n      });\n    };\n    localize();\n    document.querySelectorAll('.lang-btn').forEach(btn =>\n      btn.addEventListener('click', () => queueMicrotask(localize))\n    );\n    function firstBrowser() {\n      try {\n        if (localStorage.getItem(browserKey) !== null) return;\n        if (!window.goatcounter || typeof window.goatcounter.count !== 'function') return;\n        window.goatcounter.count({path:browserEvent, title:'First visit from browser',event:true,no_session:true});\n        localStorage.setItem(browserKey, '1');\n      } catch (_) { /* storage disabled: no unique-browser event */ }\n    }\n    const gcScript = document.getElementById('dk-goat-script');\n    gcScript.addEventListener('load', firstBrowser);\n    if (window.goatcounter && typeof window.goatcounter.count === 'function') firstBrowser();\n    async function readCounter(id,path) {\n      const out = document.getElementById(id);\n      try {\n        const r = await fetch(base + '/counter/' + encodeURIComponent(path) + '.json', {cache:'no-store'});\n        if (r.status === 404) { out.textContent = '0'; return; }\n        if (!r.ok) return;\n        const n = (await r.json()).count;\n        if (typeof n === 'number' || (typeof n === 'string' && /^[\\d\\s,.]+$/.test(n))) out.textContent = String(n);\n      } catch (_) { /* public counting not enabled or blocked; show an em dash */ }\n    }\n    const refresh = () => {\n      readCounter('dk-pageviews',location.pathname || '/');\n      readCounter('dk-unique',browserEvent);\n    };\n    refresh();\n    setTimeout(refresh, 16000);\n  })();\n  </script>\n"
              s = s.replace("</style>", css.replace("\n","\r\n") + "  </style>", 1)
              s = s.replace('<footer class="site-footer">', '<footer class="site-footer">' + panel.replace("\n","\r\n"), 1)
              s = s.replace("</body>", script.replace("\n","\r\n") + "</body>", 1)
              p.write_bytes(s.encode("utf-8"))
              print("Patched index.html successfully")
          
      - name: Remove temporary workflow and commit only HTML
        run: |
          rm -f .github/workflows/install-visitor-stats.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/install-visitor-stats.yml
          git commit -m 'Add page view and estimated unique visitor counters'
          git push origin feat/visitor-stats
# Activate existing workflow on feature branch
