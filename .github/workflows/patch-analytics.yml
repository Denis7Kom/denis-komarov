name: Apply analytics to single HTML file

on:
  push:
    branches: [feature/goatcounter-analytics]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/goatcounter-analytics
          persist-credentials: true
      - name: Patch HTML and remove temporary workflow
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_bytes().decode('utf-8')
          nl = '\r\n' if '\r\n' in s else '\n'
          if 'goatcounter-metrics-v1' in s:
              raise SystemExit('Already integrated')
          assert s.count('</style>') == 1
          assert s.count('<footer class="site-footer">') == 1
          assert s.count('</body>') == 1
          css = """
              /* goatcounter-metrics-v1 */
              .traffic-stats{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto 26px}
              .traffic-stats-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
              .traffic-stat{display:flex;align-items:center;gap:13px;flex:0 1 240px;min-width:180px;padding:13px 17px;border:1px solid rgba(255,184,77,.19);border-radius:17px;background:linear-gradient(120deg,rgba(255,179,71,.09),rgba(255,255,255,.025))}
              .traffic-stat-symbol{color:var(--accent);font-size:1.25rem}
              .traffic-stat-body{display:flex;flex-direction:column;gap:3px}
              .traffic-stat-number{color:var(--accent-3);font:800 1.3rem/1.15 var(--mono);font-variant-numeric:tabular-nums}
              .traffic-stat-label{color:var(--muted);font-size:.77rem;font-weight:600}
              .traffic-stat-note{color:var(--muted-2);font-size:.72rem;line-height:1.5;max-width:620px;text-align:center}
              @media(max-width:520px){.traffic-stat{min-width:0;flex:1 1 135px;padding:12px;gap:8px}.traffic-stat-number{font-size:1.08rem}.traffic-stat-note{padding:0 10px}}
          """
          block = """
            <div class="container traffic-stats" id="traffic-stats">
              <div class="traffic-stats-row">
                <div class="traffic-stat">
                  <span class="traffic-stat-symbol" aria-hidden="true">◉</span>
                  <span class="traffic-stat-body">
                    <span class="traffic-stat-number" id="traffic-views" aria-live="polite">—</span>
                    <span class="traffic-stat-label" data-traffic-text="views">Page views</span>
                  </span>
                </div>
                <div class="traffic-stat">
                  <span class="traffic-stat-symbol" aria-hidden="true">◇</span>
                  <span class="traffic-stat-body">
                    <span class="traffic-stat-number" id="traffic-visitors" aria-live="polite">—</span>
                    <span class="traffic-stat-label" data-traffic-text="visitors">Unique visitors*</span>
                  </span>
                </div>
              </div>
              <p class="traffic-stat-note" data-traffic-text="note">*Estimated by 8-hour sessions; not distinct people over all time. Figures may update with a delay.</p>
            </div>
          """
          script = """
            <!-- GoatCounter tracking and public counter; no credentials embedded. -->
            <script id="goatcounter-script" data-goatcounter="https://denis-komarov.goatcounter.com/count"
                    data-goatcounter-settings='{"no_onload":true}'
                    defer src="https://gc.zgo.at/count.js"></script>
            <script>
            (() => {
              'use strict';
              const host = 'https://denis-komarov.goatcounter.com';
              const translations = {
                en: {views:'Page views',visitors:'Unique visitors*',note:'*Estimated by 8-hour sessions; not distinct people over all time. Figures may update with a delay.'},
                ru: {views:'Просмотры',visitors:'Уникальные посетители*',note:'*Оценка по сеансам длительностью 8 часов, не количество разных людей за всё время. Данные обновляются с задержкой.'},
                it: {views:'Visualizzazioni',visitors:'Visitatori unici*',note:'*Stima basata su sessioni di 8 ore, non su persone distinte nel tempo. I dati possono essere aggiornati con ritardo.'},
                de: {views:'Seitenaufrufe',visitors:'Eindeutige Besucher*',note:'*Schätzung anhand von 8-Stunden-Sitzungen, nicht unterschiedlicher Personen insgesamt. Die Zahlen werden verzögert aktualisiert.'}
              };
              function localize() {
                const lang = document.documentElement.lang.toLowerCase().split('-')[0];
                const words = translations[lang] || translations.en;
                document.querySelectorAll('[data-traffic-text]').forEach(el => {
                  el.textContent = words[el.dataset.trafficText];
                });
              }
              document.querySelectorAll('.lang-btn').forEach(el => el.addEventListener('click', localize));
              localize();

              let counted = false;
              function countVisit() {
                if (counted || !window.goatcounter || typeof window.goatcounter.count !== 'function') return;
                if (location.hostname !== 'denis7kom.github.io') return;
                counted = true;
                // Deduplicate repeated loads per path within the 8-hour GoatCounter session.
                window.goatcounter.count({path:'/denis-komarov',title:'Denis Komarov — visit',event:false,no_session:false});
                // Separate event: count every actual page load, including reloads.
                window.goatcounter.count({path:'page-views',title:'Page views',event:true,no_session:true});
              }
              const tracker = document.getElementById('goatcounter-script');
              if (tracker) tracker.addEventListener('load', countVisit);
              countVisit();

              async function getMetric(elementId, path) {
                const el = document.getElementById(elementId);
                if (!el) return;
                try {
                  const response = await fetch(host + path, {mode:'cors'});
                  if (!response.ok) throw new Error('Public counter unavailable');
                  const payload = await response.json();
                  if (typeof payload.count !== 'string' && typeof payload.count !== 'number') throw new Error('Invalid count');
                  el.textContent = String(payload.count);
                } catch (error) {
                  // Don't present invented figures; public counters are disabled by default.
                  el.textContent = '—';
                  el.title = 'Enable public visitor counts in GoatCounter settings';
                }
              }
              getMetric('traffic-views', '/counter/page-views.json');
              getMetric('traffic-visitors', '/counter//denis-komarov.json');
            })();
            </script>
          """
          s = s.replace('</style>', css.replace('\n', nl) + nl + '  </style>', 1)
          s = s.replace('<footer class="site-footer">', '<footer class="site-footer">' + block.replace('\n', nl), 1)
          s = s.replace('</body>', script.replace('\n', nl) + nl + '</body>', 1)
          assert 'id="traffic-views"' in s and 'id="traffic-visitors"' in s
          assert s.count('</body>') == 1
          p.write_bytes(s.encode('utf-8'))
          PY
          rm -f .github/workflows/patch-analytics.yml
      - name: Commit the HTML-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-analytics.yml
          git commit -m "Add two public GoatCounter counters to index.html"
          git push origin HEAD:feature/goatcounter-analytics
