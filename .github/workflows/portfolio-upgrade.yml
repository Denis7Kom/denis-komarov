name: Apply portfolio upgrade
on:
  push:
    branches: [feat/portfolio-experience-refresh]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/portfolio-experience-refresh
      - name: Apply progressive enhancement
        run: python3 .github/upgrade-portfolio.py
      - name: Commit updated HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Upgrade portfolio experience in single index.html'
            git push origin HEAD:feat/portfolio-experience-refresh
          fi
