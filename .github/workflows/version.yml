name: Semantic versioning
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: semantic-version-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update version and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release.py
      - name: Publish merged version as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if [ "$version" = "2.0.3" ]; then exit 0; fi
          tag="v$version"
          target=$(git log --first-parent -1 --format=%H -- VERSION)
          test -n "$target"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$target"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show "$target:index.html" | grep -Fx '<script type="module" src="./version-badge.js"></script>' >/dev/null || \
            git show "$target:index.html" | grep -F 'src="./version-badge.js"' >/dev/null
          git show "$target:version-badge.js" | grep -F "const projectVersion = \"$version\";" >/dev/null
          notes=$(mktemp)
          git show "$target:CHANGELOG.md" | awk -v version="$version" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found { print }
          ' > "$notes"
          grep -q '[^[:space:]]' "$notes"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"
          fi
