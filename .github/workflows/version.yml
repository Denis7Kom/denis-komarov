name: Semantic versioning
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: semantic-version-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update version and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release.py
      - name: Publish merged version as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || exit 0
          git diff --quiet HEAD^ HEAD -- VERSION && exit 0
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes --title "$tag"
          fi
